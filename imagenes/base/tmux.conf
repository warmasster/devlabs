# tmux invisible: solo está para que la sesión sobreviva si se cierra la pestaña.
set -g status off
set -g prefix C-]
unbind C-b
bind C-] send-prefix
# Sin ratón ni pantalla alternativa: seleccionar, copiar y la rueda funcionan como en
# una terminal normal (el historial queda en el scrollback del navegador). Las apps que
# piden ratón (htop, vim, mc) lo siguen recibiendo.
set -g mouse off
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,xterm*:smcup@:rmcup@"
set -g escape-time 0
set -g history-limit 20000
set -g set-clipboard on
set -g extended-keys on
set -g allow-passthrough on
# Si el alumno lanza su propio tmux dentro, que no choque con el nuestro.
set -g default-command "${SHELL}"
