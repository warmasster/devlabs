# 0.1 · Lab de lección. La lección ve tus procesos (corriendo, parados, al fondo) mientras pruebas las teclas.
id: n0-1a-teclas
titulo: Las teclas de la shell
motor: contenedor
pool: 1
nodos:
  - { nombre: lab, rol: tu shell, imagen: "relavops/base:1", memoria: 256m, cpus: 1 }
preparar:
  - nodo: lab
    script: |
      # Guarda el código del último comando y el historial, y avisa a labd de que ha vuelto el prompt.
      cat >> /etc/bash.bashrc <<'EOF'
      PROMPT_COMMAND='echo $? > /run/.rc; history -a; printf "\033]6973;\007"'
      EOF
      printf '%s\n' 'ls -la' 'df -h' 'echo "el tesoro está en la línea 3"' 'free -m' 'ps aux' > /root/.bash_history
      mkdir -p /srv/una-carpeta-con-un-nombre-larguisimo-de-verdad
      echo "Has llegado sin escribir la ruta entera. Eso es TAB." > /srv/una-carpeta-con-un-nombre-larguisimo-de-verdad/fichero-escondido.txt
      mkdir -p /root/.ok
      printf 'import atexit, pathlib\natexit.register(lambda: pathlib.Path("/root/.ok/ctrld").touch())\n' > /etc/pystart.py
      echo 'export PYTHONSTARTUP=/etc/pystart.py' > /etc/profile.d/lab.sh
sondas:
  - { id: ultimo@lab, nodo: lab, script: "tail -n 1 /root/.bash_history 2>/dev/null" }
  - id: procesos@lab
    nodo: lab
    script: |
      # Solo procesos con 1 segundo o más de vida: así no parpadean los de las sondas ni los comandos rápidos.
      ps -eo pid=,etimes=,stat=,args= | awk '$2 >= 1 && $1 != 1 && $3 !~ /^Z/ && !($4 == "sleep" && $5 == "infinity") && $4 !~ /docker-init/ && $4 != "bash" && $4 != "-bash" && $5 !~ /relavops[/]vigia$/ { $2 = ""; print }'
  - id: cat@lab
    nodo: lab
    script: |
      c=$(tail -n 1 /root/.bash_history 2>/dev/null)
      case "$c" in *[\;\|\&\>\<\$\`]*) exit 0 ;; "cat "*) ;; *) exit 0 ;; esac
      d=$(readlink /proc/$(pgrep -n -x bash)/cwd 2>/dev/null); cd "${d:-/root}" || exit 0
      head -c 3000 -- $(printf '%s' "${c#cat }" | sed 's#~#/root#g') 2>&1
mision:
  - { id: man, titulo: La ayuda, texto: "`ls --help`", xp: 10, check: { nodo: lab, script: "grep -qE '^[a-z]+ +--help' /root/.bash_history" } }
  - { id: tab, titulo: TAB completa, texto: "`cat /srv/una` + TAB", xp: 15, check: { nodo: lab, script: "grep -q 'fichero-escondido.txt' /root/.bash_history" } }
  - { id: ctrlc, titulo: Ctrl+C corta, texto: "`sleep 100` y Ctrl+C", xp: 15, check: { nodo: lab, script: "grep -qE '^sleep 100' /root/.bash_history && ! ps -eo stat=,args= | awk '$1 !~ /^Z/ && $2 == \"sleep\" && $3 == \"100\" {f = 1} END {exit !f}'" } }
  - id: parado
    titulo: Ctrl+Z para
    texto: "`sleep 200` y Ctrl+Z"
    xp: 15
    check: { nodo: lab, script: "ps -eo stat=,args= | awk '$1 ~ /^T/ && $2 == \"sleep\" && $3 == \"200\" {f = 1} END {exit !f}'" }
  - id: fondo
    titulo: bg lo manda al fondo
    texto: "`bg`"
    xp: 15
    check: { nodo: lab, script: "grep -qE '^bg' /root/.bash_history && ps -eo stat=,args= | awk '$1 ~ /^S/ && $1 !~ /[+]/ && $2 == \"sleep\" && $3 == \"200\" {f = 1} END {exit !f}'" }
  - { id: jobs, titulo: jobs lista los trabajos, texto: "`jobs`", xp: 5, check: { nodo: lab, script: "grep -qxE 'jobs *' /root/.bash_history" } }
  - { id: matar, titulo: kill %1, texto: "`kill %1`", xp: 15, check: { nodo: lab, script: "grep -qE '^kill +%' /root/.bash_history && ! ps -eo stat=,args= | awk '$1 !~ /^Z/ && $2 == \"sleep\" && $3 == \"200\" {f = 1} END {exit !f}'" } }
  - { id: ctrld, titulo: Ctrl+D sale, texto: "`python3` y Ctrl+D", xp: 10, check: { nodo: lab, script: "test -f /root/.ok/ctrld" } }
  - id: shell
    titulo: Qué shell
    texto: ""
    xp: 5
    check:
      nodo: lab
      script: |
        grep -qF 'echo $SHELL' /root/.bash_history
  - id: cdtmp
    titulo: El prompt cambia
    texto: ""
    xp: 5
    check:
      nodo: lab
      script: |
        grep -qE '^cd +/tmp' /root/.bash_history && grep -qxE 'cd *' /root/.bash_history
  - id: sleep5
    titulo: Primer plano
    texto: ""
    xp: 5
    check:
      nodo: lab
      script: |
        grep -qxE 'sleep 5 *' /root/.bash_history
  - id: less
    titulo: Salir de less
    texto: ""
    xp: 5
    check:
      nodo: lab
      script: |
        grep -qE '^less' /root/.bash_history && ! pgrep -x less >/dev/null
