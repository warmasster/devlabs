# 0.9 · Lab de lección. La lección dibuja en vivo las zonas de git y el grafo de commits de ~/proyecto.
id: n0-9a-historia
titulo: La historia de un proyecto
motor: contenedor
pool: 1
nodos:
  - { nombre: lab, rol: tu máquina, imagen: "relavops/base:1", memoria: 256m, cpus: 1 }
preparar:
  - nodo: lab
    script: |
      # Guarda el código del último comando y el historial, y avisa a labd de que ha vuelto el prompt.
      cat >> /etc/bash.bashrc <<'EOF'
      PROMPT_COMMAND='echo $? > /run/.rc; history -a; printf "\033]6973;\007"'
      EOF
      : > /root/.bash_history
      git config --global user.name "Tú"; git config --global user.email "tu@relavops.local"
      git config --global init.defaultBranch main; git config --global advice.detachedHead false
      mkdir -p /root/proyecto && echo "# Mi tienda" > /root/proyecto/LEEME.md && echo "<h1>Tienda</h1>" > /root/proyecto/index.html
      git init -q --bare /srv/git/tienda.git
sondas:
  - { id: ultimo@lab, nodo: lab, script: "tail -n 1 /root/.bash_history 2>/dev/null" }
  - id: zonas
    nodo: lab
    script: |
      cd /root/proyecto 2>/dev/null && git rev-parse --git-dir >/dev/null 2>&1 || exit 0
      git status --porcelain | awk '{x = substr($0, 1, 1); y = substr($0, 2, 1); f = substr($0, 4); if (x != " " && x != "?") print "S " f; if (y != " " || x == "?") print "W " f}'
      echo "C $(git rev-list --count --all 2>/dev/null || echo 0)"
  - { id: grafo, nodo: lab, script: "cd /root/proyecto 2>/dev/null && git log --all --format='%h|%p|%s|%D' 2>/dev/null | head -30" }
mision:
  - { id: init, titulo: git init, texto: "`git init`", xp: 10, check: { nodo: lab, script: "test -d /root/proyecto/.git" } }
  - { id: add, titulo: git add, texto: "`git add .`", xp: 10, check: { nodo: lab, script: "cd /root/proyecto && { [ -n \"$(git diff --cached --name-only 2>/dev/null)\" ] || [ \"$(git rev-list --count --all 2>/dev/null)\" -ge 1 ]; }" } }
  - { id: commit, titulo: git commit, texto: "`git commit -m \"…\"`", xp: 15, check: { nodo: lab, script: "[ \"$(git -C /root/proyecto rev-list --count --all 2>/dev/null)\" -ge 1 ]" } }
  - { id: segundo, titulo: Otro commit, texto: "cambia algo y commit", xp: 15, check: { nodo: lab, script: "[ \"$(git -C /root/proyecto rev-list --count --all 2>/dev/null)\" -ge 2 ]" } }
  - { id: rama, titulo: Una rama, texto: "`git switch -c ofertas`", xp: 15, check: { nodo: lab, script: "git -C /root/proyecto rev-parse --verify -q ofertas >/dev/null && [ \"$(git -C /root/proyecto rev-list --count ofertas 2>/dev/null)\" -ge 3 ]" } }
  - { id: merge, titulo: Unir la rama, texto: "`git merge ofertas`", xp: 15, check: { nodo: lab, script: "git -C /root/proyecto merge-base --is-ancestor ofertas main 2>/dev/null && [ \"$(git -C /root/proyecto rev-list --count ofertas)\" -ge 3 ]" } }
  - { id: push, titulo: Subir al remoto, texto: "`git push`", xp: 15, check: { nodo: lab, script: "[ \"$(git -C /srv/git/tienda.git rev-list --count main 2>/dev/null)\" -ge 3 ]" } }
  - { id: restore, titulo: Deshacer un cambio, texto: "`git restore`", xp: 15, check: { nodo: lab, script: "grep -qE '^git restore' /root/.bash_history && [ -z \"$(git -C /root/proyecto status --porcelain index.html)\" ]" } }
  - { id: clone, titulo: Clonar, texto: "`git clone`", xp: 15, check: { nodo: lab, script: "git -C /root/copia rev-parse --git-dir >/dev/null 2>&1" } }
  - id: version
    titulo: Versión de git
    texto: ""
    xp: 5
    check:
      nodo: lab
      script: |
        grep -qE '^git +--version' /root/.bash_history
  - id: status
    titulo: git status
    texto: ""
    xp: 5
    check:
      nodo: lab
      script: |
        grep -qE '^git +status' /root/.bash_history
  - id: diff
    titulo: git diff
    texto: ""
    xp: 5
    check:
      nodo: lab
      script: |
        grep -qE '^git +diff' /root/.bash_history
