# 0.9 · Bash scripting: scripts que pasan tests automáticos y un backup rotativo con bugs.
id: n0-9-scripts
titulo: Scripts que pasan los tests
motor: contenedor
pool: 1
nodos:
  - nombre: lab
    imagen: relavops/base:1
    memoria: 256m
    cpus: 1
preparar:
  - nodo: lab
    script: |
      mkdir -p "/srv/pruebas/mis logs" /srv/pruebas/vacia
      cd "/srv/pruebas/mis logs" && touch a.log b.log "c con espacios.log" d.log notas.txt foto.jpg
      cat > /usr/local/bin/prueba <<'EOF'
      #!/bin/bash
      # Ejecuta los tests de la misión y dice qué falla. Úsalo cuanto quieras.
      ok() { printf '\e[32m✔\e[0m %s\n' "$1"; }
      ko() { printf '\e[31m✘\e[0m %s\n   → %s\n' "$1" "$2"; }
      t() { local n=$1 d=$2; shift 2; if "$@" >/dev/null 2>&1; then ok "$n"; else ko "$n" "$d"; fi; }
      t "saluda.sh es ejecutable"            "chmod +x ~/saluda.sh"           test -x ~/saluda.sh
      t "saluda.sh Ana → Hola, Ana"          "usa \$1"                        bash -c '[ "$(~/saluda.sh Ana)" = "Hola, Ana" ]'
      t "saluda.sh → Hola, mundo"            'prueba ${1:-mundo}'             bash -c '[ "$(~/saluda.sh)" = "Hola, mundo" ]'
      t "par.sh 4 sale con 0"                "exit 0 si es par"               bash -c '~/par.sh 4'
      t "par.sh 7 sale con 1"                "exit 1 si es impar"             bash -c '~/par.sh 7; [ $? -eq 1 ]'
      t "cuenta.sh con espacios en la ruta"  'comillas: "$1"'                 bash -c '[ "$(~/cuenta.sh "/srv/pruebas/mis logs")" = 4 ]'
      t "cuenta.sh en carpeta vacía → 0"     "sin .log debe decir 0"          bash -c '[ "$(~/cuenta.sh /srv/pruebas/vacia)" = 0 ]'
      t "mayusculas.sh lee de stdin"         "tr a-z A-Z"                     bash -c '[ "$(echo "hola devops" | ~/mayusculas.sh)" = "HOLA DEVOPS" ]'
      t "suma.sh 2 3 10 → 15"                'bucle sobre "$@"'               bash -c '[ "$(~/suma.sh 2 3 10)" = 15 ]'
      t "suma.sh usa una función"            "nombre() { … }"                 grep -qE '^[[:space:]]*[a-z_]+[[:space:]]*\(\)' ~/suma.sh
      EOF
      chmod +x /usr/local/bin/prueba
      cat > /usr/local/bin/prueba-backup <<'EOF'
      #!/bin/bash
      # Test del backup rotativo. Lo que exige: ver ~/LEEME-backup.txt
      S="/srv/mis datos"; B=/backups
      mkdir -p /tmp/.pb && cd /tmp/.pb
      rm -rf "$B" "$S" "/srv/mis"; mkdir -p "$S"; echo base > "$S/a.txt"
      for i in 1 2 3 4 5 6 7; do
        echo "v$i" > "$S/version.txt"
        timeout 2 /root/backup.sh >/dev/null 2>&1 || { echo "FALLO: backup.sh devolvió error en la pasada $i"; exit 1; }
      done
      n=$(ls "$B"/backup-*.tar.gz 2>/dev/null | wc -l)
      [ "$n" -eq 5 ] || { echo "FALLO: quedan $n backups y deben quedar 5"; exit 1; }
      nuevo=$(ls "$B"/backup-*.tar.gz | sort | tail -1); viejo=$(ls "$B"/backup-*.tar.gz | sort | head -1)
      [ "$(tar xzOf "$nuevo" ./version.txt 2>/dev/null)" = v7 ] || { echo "FALLO: el backup más nuevo no contiene la versión 7 de /srv/mis datos"; exit 1; }
      [ "$(tar xzOf "$viejo" ./version.txt 2>/dev/null)" = v3 ] || { echo "FALLO: la rotación borra los que no toca (el más viejo debería ser la versión 3)"; exit 1; }
      mv "$S" "$S.bak"
      timeout 2 /root/backup.sh >/dev/null 2>&1 && { mv "$S.bak" "$S"; echo "FALLO: sin carpeta de origen, backup.sh dice que todo fue bien"; exit 1; }
      mv "$S.bak" "$S"
      nuevo=$(ls "$B"/backup-*.tar.gz | sort | tail -1)
      [ "$(tar xzOf "$nuevo" ./version.txt 2>/dev/null)" = v7 ] || { echo "FALLO: con el origen roto se ha colado un backup vacío"; exit 1; }
      echo "TODO OK: el backup rota, guarda lo correcto y falla alto cuando debe."
      EOF
      chmod +x /usr/local/bin/prueba-backup
      cat > /root/LEEME-backup.txt <<'EOF'
      backup.sh debe:
        1. Comprimir el contenido de "/srv/mis datos" (sí, con espacio) en /backups/backup-<fecha>.tar.gz
        2. Guardar solo los 5 más recientes y borrar los demás
        3. Si algo falla (por ejemplo, no existe el origen), salir con error y no dejar backups a medias
      Compruébalo con: prueba-backup     ·     Para ver qué hace línea a línea: bash -x ~/backup.sh
      EOF
mision:
  - id: saluda
    titulo: Hola, script
    texto: "Crea `~/saluda.sh`. Con un argumento imprime `Hola, Ana`, y sin argumentos `Hola, mundo`. Hazlo ejecutable. Escribe `prueba` cuando quieras."
    pista: 'echo "Hola, ${1:-mundo}"'
    xp: 10
    check: { nodo: lab, script: 'test -x /root/saluda.sh && [ "$(/root/saluda.sh Ana)" = "Hola, Ana" ] && [ "$(/root/saluda.sh)" = "Hola, mundo" ]' }
  - id: par
    titulo: Códigos de salida
    texto: "`~/par.sh N` no imprime nada. Sale con **0** si N es par y con **1** si es impar."
    pista: 'if [ $(( $1 % 2 )) -eq 0 ]; then exit 0; else exit 1; fi'
    xp: 15
    check: { nodo: lab, script: 'test -x /root/par.sh && /root/par.sh 4 && /root/par.sh 0 && { /root/par.sh 7; [ $? -eq 1 ]; }' }
  - id: cuenta
    titulo: Bucles y comillas
    texto: "`~/cuenta.sh DIR` imprime cuántos `.log` hay en DIR. Tiene que funcionar con `\"/srv/pruebas/mis logs\"` (espacios) y con una carpeta vacía (0)."
    pista: 'n=0; for f in "$1"/*.log; do [ -e "$f" ] && n=$((n+1)); done; echo $n'
    xp: 20
    check: { nodo: lab, script: 'test -x /root/cuenta.sh && [ "$(/root/cuenta.sh "/srv/pruebas/mis logs")" = 4 ] && [ "$(/root/cuenta.sh /srv/pruebas/vacia)" = 0 ]' }
  - id: mayus
    titulo: Leer de stdin
    texto: "`~/mayusculas.sh` lee lo que le llega por la tubería y lo devuelve en mayúsculas. `echo hola | ~/mayusculas.sh` da `HOLA`."
    pista: "Dentro del script basta una línea, `tr a-z A-Z`"
    xp: 10
    check: { nodo: lab, script: 'test -x /root/mayusculas.sh && [ "$(echo "hola devops" | /root/mayusculas.sh)" = "HOLA DEVOPS" ]' }
  - id: suma
    titulo: Funciones y "$@"
    texto: "`~/suma.sh 2 3 10` imprime `15`, con cualquier número de argumentos. La suma tiene que estar dentro de una **función**."
    pista: 'suma() { local t=0; for n in "$@"; do t=$((t+n)); done; echo $t; }; suma "$@"'
    xp: 20
    check: { nodo: lab, script: "test -x /root/suma.sh && [ \"$(/root/suma.sh 2 3 10)\" = 15 ] && [ \"$(/root/suma.sh 7)\" = 7 ] && grep -qE '^[[:space:]]*[a-z_]+[[:space:]]*\\(\\)' /root/suma.sh" }
boss:
  titulo: "El backup rotativo"
  texto: "Heredas `~/backup.sh`. Lleva semanas diciendo que todo va bien y no es verdad. Lee `~/LEEME-backup.txt` y arréglalo hasta que `prueba-backup` diga **TODO OK**."
  xp: 80
  check:
    - { nodo: lab, script: "test -f /run/.boss && /usr/local/bin/prueba-backup >/dev/null 2>&1" }
  fallos:
    - id: comillas
      romper:
        - nodo: lab
          script: |
            touch /run/.boss
            cat > /root/backup.sh <<'EOF'
            #!/bin/bash
            ORIGEN="/srv/mis datos"
            DESTINO=/backups
            MAX=5
            mkdir -p $DESTINO
            cd $ORIGEN
            tar czf $DESTINO/backup-$(date +%Y%m%d-%H%M%S-%N).tar.gz .
            ls $DESTINO/backup-*.tar.gz | sort | head -n -$MAX | xargs -r rm -f
            echo "Backup OK"
            EOF
            chmod +x /root/backup.sh
      pistas:
        - { coste: 5, texto: "Ejecuta `bash -x ~/backup.sh` y mira la línea del `cd`. ¿A qué carpeta intenta entrar?" }
        - { coste: 10, texto: "Sin comillas, `cd $ORIGEN` recibe dos argumentos. Y como no hay `set -e`, el tar sigue en la carpeta en la que estabas." }
        - { coste: 10, texto: "Añade `set -euo pipefail` arriba y pon comillas a todas las variables." }
      solucion: "`cd $ORIGEN` sin comillas fallaba con el espacio, y sin `set -e` el tar empaquetaba la carpeta equivocada."
    - id: rotacion
      romper:
        - nodo: lab
          script: |
            touch /run/.boss
            cat > /root/backup.sh <<'EOF'
            #!/bin/bash
            set -euo pipefail
            ORIGEN="/srv/mis datos"
            DESTINO=/backups
            MAX=5
            mkdir -p "$DESTINO"
            tar czf "$DESTINO/backup-$(date +%Y%m%d-%H%M%S-%N).tar.gz" -C "$ORIGEN" .
            # Borra los que sobran
            ls "$DESTINO"/backup-*.tar.gz | sort | tail -n +$((MAX + 1)) | xargs -r rm -f
            echo "Backup OK"
            EOF
            chmod +x /root/backup.sh
      pistas:
        - { coste: 5, texto: "Ejecuta `prueba-backup`. Guarda 5, pero mira cuáles." }
        - { coste: 10, texto: "Los nombres llevan la fecha y `sort` deja el más viejo arriba. El script usa `tail -n +6`, que se queda con los de abajo, los nuevos, y esos son los que borra." }
        - { coste: 10, texto: "Quieres borrar todos menos los 5 últimos. Eso es `head -n -5`." }
      solucion: "La rotación borraba los más nuevos. Con nombres con fecha, `sort | head -n -5` son los que sobran."
    - id: silencio
      romper:
        - nodo: lab
          script: |
            touch /run/.boss
            cat > /root/backup.sh <<'EOF'
            #!/bin/bash
            ORIGEN="/srv/mis datos"
            DESTINO=/backups
            MAX=5
            mkdir -p "$DESTINO"
            tar czf "$DESTINO/backup-$(date +%Y%m%d-%H%M%S-%N).tar.gz" -C "$ORIGEN" . 2>/dev/null
            ls "$DESTINO"/backup-*.tar.gz | sort | head -n -"$MAX" | xargs -r rm -f
            echo "Backup OK"
            EOF
            chmod +x /root/backup.sh
      pistas:
        - { coste: 5, texto: "Funciona… hasta que falta el origen. ¿Qué código de salida da? `~/backup.sh; echo $?`" }
        - { coste: 10, texto: "El script acaba con `echo`, que siempre sale bien. Y manda los errores del tar a /dev/null, donde se pierden." }
        - { coste: 10, texto: "Comprueba el origen antes con `[ -d \"$ORIGEN\" ] || exit 1` y usa `set -euo pipefail`. Si tar falla, deja un fichero a medias." }
      solucion: "El script se tragaba el fallo del tar. Comprobar el origen al principio y `set -euo pipefail` lo hacen fallar alto y sin backup a medias."
