# 0.7 · Expresiones regulares: sacar datos de logs con grep -E y transformar con sed.
id: n0-7-regex
titulo: Cazador de patrones
motor: contenedor
pool: 1
nodos:
  - nombre: lab
    imagen: relavops/base:1
    memoria: 256m
    cpus: 1
preparar:
  - nodo: lab
    script: |
      cat > /usr/local/bin/responde <<'EOF'
      #!/bin/sh
      [ $# -ge 2 ] || { echo "uso: responde <pregunta> <respuesta>"; exit 1; }
      mkdir -p /root/.respuestas; k=$1; shift
      printf '%s\n' "$*" > "/root/.respuestas/$k"; echo "Apuntado: $k = $*"
      EOF
      chmod +x /usr/local/bin/responde
      mkdir -p /srv/logs /srv/web /usr/local/lib/lab
      cat > /usr/local/lib/lab/gen.py <<'EOF'
      import random, re, sys
      R = random.Random()
      nombres = ['ana', 'luis.perez', 'eva_m', 'jorge', 'marta.g', 'noa', 'iker99', 'sara.lopez']
      dominios = ['empresa.es', 'correo.com', 'tienda.org', 'mail.net']
      def email(): return f'{R.choice(nombres)}@{R.choice(dominios)}'
      def ip(): return '.'.join(str(R.randint(1, 254)) for _ in range(4))
      modo = sys.argv[1]
      if modo == 'base':
          ips, emails, out = set(), set(), []
          for i in range(800):
              t = R.random()
              if t < 0.15: l = f'ERROR {i:04d} fallo al conectar con {(a := ip())}'; ips.add(a)
              elif t < 0.30: l = f'INFO {i:04d} alta de usuario {(e := email())}'; emails.add(e)
              elif t < 0.40: l = f'WARN {i:04d} reintento; último ERROR ignorado'
              elif t < 0.55: l = f'INFO {i:04d} versión desplegada build {R.randint(1,9)}.{R.randint(0,20)}.{R.randint(0,99)}'
              elif t < 0.70: l = f'INFO {i:04d} petición de {(a := ip())} enviada a {(e := email())}'; ips.add(a); emails.add(e)
              else: l = f'DEBUG {i:04d} latido ok'
              out.append(l)
          open('/srv/logs/app.log', 'w').write('\n'.join(out) + '\n')
          open('/run/.emails', 'w').write('\n'.join(sorted(emails)) + '\n')
          open('/run/.nips', 'w').write(f'{len(ips)}\n')
          links = [f'{R.choice(["Docs", "Blog", "Tienda", "Soporte"])}: http://{R.choice(dominios)}/{R.choice(["a", "b", "c"])}{k}' for k in range(40)] + ['Seguro: https://empresa.es/ok'] * 5
          R.shuffle(links)
          open('/srv/web/enlaces.txt', 'w').write('\n'.join(links) + '\n')
          open('/run/.nlinks', 'w').write(f'{len(links)}\n')
          f = []
          for k in range(30):
              d, m, a = R.randint(1, 28), R.randint(1, 12), R.choice([2025, 2026])
              f.append((f'Pedido {4000 + k} entregado el {d:02d}/{m:02d}/{a}', f'Pedido {4000 + k} entregado el {a}-{m:02d}-{d:02d}'))
          open('/srv/fechas.txt', 'w').write('\n'.join(x for x, _ in f) + '\n')
          open('/run/.fechas', 'w').write('\n'.join(y for _, y in f) + '\n')
          sys.exit()
      # Boss: anonimizar soporte.log
      letras = 'TRWAGMYFPDXBNJZSQVHLCKE'
      def dni(): n = R.randint(10000000, 99999999); return f'{n}{letras[n % 23]}'
      def tel(): return f'{R.choice("67")}{R.randint(10,99)} {R.randint(100,999)} {R.randint(100,999)}'
      def tarjeta(): return ' '.join(f'{R.randint(1000, 9999)}' for _ in range(4))
      lineas = []
      for k in range(120):
          c = R.random()
          if c < 0.35: lineas.append(f'#{k:03d} cliente {email()} pide la factura de octubre')
          elif c < 0.55: lineas.append(f'#{k:03d} cliente con DNI {dni()} llama desde el {tel()}')
          elif c < 0.75: lineas.append(f'#{k:03d} cobro rechazado en la tarjeta {tarjeta()}')
          else: lineas.append(f'#{k:03d} incidencia {R.randint(100, 999)} cerrada sin datos personales')
      txt = '\n'.join(lineas) + '\n'
      open('/srv/logs/soporte.log', 'w').write(txt)
      if modo == 'emails':
          esp = re.sub(r'[a-z0-9._]+@[a-z]+\.[a-z]+', '[email]', txt)
      elif modo == 'dni':
          esp = re.sub(r'\b[0-9]{8}[A-Z]\b', '[dni]', txt); esp = re.sub(r'\b[67][0-9]{2} [0-9]{3} [0-9]{3}\b', '[tel]', esp)
      else:
          esp = re.sub(r'\b[0-9]{4} [0-9]{4} [0-9]{4} ([0-9]{4})\b', r'**** **** **** \1', txt)
      open('/run/.esperado', 'w').write(esp)
      EOF
      python3 /usr/local/lib/lab/gen.py base
mision:
  - id: errores
    titulo: Solo las que EMPIEZAN por ERROR
    texto: "En `/srv/logs/app.log`, cuenta las líneas que **empiezan** por ERROR y contesta con `responde errores`. Hay líneas WARN que lo nombran en medio."
    pista: grep -c '^ERROR' /srv/logs/app.log
    xp: 10
    check: { nodo: lab, script: 'test "$(cat /root/.respuestas/errores 2>/dev/null)" = "$(grep -c "^ERROR" /srv/logs/app.log)"' }
  - id: emails
    titulo: Extrae los emails
    texto: "Saca todos los emails del log, sin repetidos y ordenados, a `~/emails.txt`."
    pista: grep -oE '[a-z0-9._]+@[a-z]+\.[a-z]+' /srv/logs/app.log | sort | uniq > ~/emails.txt
    xp: 15
    check: { nodo: lab, script: '[ -f /root/emails.txt ] && [ "$(sort -u /root/emails.txt)" = "$(cat /run/.emails)" ]' }
  - id: ips
    titulo: Cuenta IPs (sin caer en la trampa)
    texto: "Cuenta las **IPs distintas** que aparecen y contesta con `responde ips`. Los números de versión como `build 3.14.7` no son IPs."
    pista: "grep -oE '([0-9]{1,3}\\.){3}[0-9]{1,3}' /srv/logs/app.log | sort | uniq | wc -l"
    xp: 15
    check: { nodo: lab, script: 'test "$(cat /root/.respuestas/ips 2>/dev/null)" = "$(cat /run/.nips)"' }
  - id: https
    titulo: Todo a HTTPS (sed)
    texto: "En `/srv/web/enlaces.txt` cambia todos los `http://` por `https://`, editando el fichero en sitio."
    pista: sed -i 's#http://#https://#g' /srv/web/enlaces.txt
    xp: 10
    check: { nodo: lab, script: '! grep -q "http://" /srv/web/enlaces.txt && [ "$(grep -c "https://" /srv/web/enlaces.txt)" -eq "$(cat /run/.nlinks)" ]' }
  - id: fechas
    titulo: Fechas al formato ISO (grupos)
    texto: "En `/srv/fechas.txt` las fechas están como `03/11/2026`. Déjalas como `2026-11-03` usando grupos de captura en sed."
    pista: "sed -E -i 's#([0-9]{2})/([0-9]{2})/([0-9]{4})#\\3-\\2-\\1#' /srv/fechas.txt"
    xp: 20
    check: { nodo: lab, script: "cmp -s /srv/fechas.txt /run/.fechas" }
boss:
  titulo: "Datos personales en los logs"
  texto: "Mañana hay auditoría de protección de datos. `/srv/logs/soporte.log` tiene datos personales que no deberían estar ahí. Anonimízalo **en sitio**, sin cambiar nada más. La primera pista es gratis y te dice qué busca el auditor."
  xp: 70
  check:
    - { nodo: lab, script: "test -f /run/.esperado && cmp -s /srv/logs/soporte.log /run/.esperado" }
  fallos:
    - id: emails
      romper:
        - { nodo: lab, script: "python3 /usr/local/lib/lab/gen.py emails" }
      pistas:
        - { coste: 0, texto: "El auditor pide cambiar cada email por `[email]`. Nada más." }
        - { coste: 10, texto: "Con sed -E -i y una clase para la parte de antes de la @, por ejemplo `[a-z0-9._]+@…`." }
      solucion: "`sed -E -i 's/[a-z0-9._]+@[a-z]+\\.[a-z]+/[email]/g' soporte.log`"
    - id: dni
      romper:
        - { nodo: lab, script: "python3 /usr/local/lib/lab/gen.py dni" }
      pistas:
        - { coste: 0, texto: "El auditor pide cambiar cada DNI, 8 cifras y una letra, por `[dni]`, y cada teléfono, `6xx xxx xxx` o `7xx xxx xxx`, por `[tel]`." }
        - { coste: 10, texto: "Son dos sustituciones. Lanza `sed -E -i` dos veces, una para el DNI y otra para el teléfono." }
      solucion: "`[0-9]{8}[A-Z]` para el DNI y `[67][0-9]{2} [0-9]{3} [0-9]{3}` para el teléfono."
    - id: tarjetas
      romper:
        - { nodo: lab, script: "python3 /usr/local/lib/lab/gen.py tarjetas" }
      pistas:
        - { coste: 0, texto: "El auditor pide dejar de cada tarjeta solo los 4 últimos dígitos, así `**** **** **** 1234`." }
        - { coste: 10, texto: "Captura el último grupo con paréntesis y reúsalo con `\\1`. En el reemplazo, `*` es un asterisco normal." }
      solucion: "`sed -E -i 's/[0-9]{4} [0-9]{4} [0-9]{4} ([0-9]{4})/**** **** **** \\1/g'`"
