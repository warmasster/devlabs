# 0.4 · Permisos: carpetas de equipo, bits especiales y el backup que no arranca.
id: n0-4-permisos
titulo: Permisos de un equipo real
motor: contenedor
pool: 1
nodos:
  - nombre: lab
    imagen: relavops/base:1
    memoria: 256m
    cpus: 1
preparar:
  - nodo: lab
    script: |
      cat > /usr/local/bin/responde <<'EOF'
      #!/bin/sh
      [ $# -ge 2 ] || { echo "uso: responde <pregunta> <respuesta>"; exit 1; }
      mkdir -p /root/.respuestas; k=$1; shift
      printf '%s\n' "$*" > "/root/.respuestas/$k"; echo "Apuntado: $k = $*"
      EOF
      chmod +x /usr/local/bin/responde
      groupadd equipo; for u in ana luis eva copias; do useradd -m -s /bin/bash "$u"; done
      usermod -aG equipo ana; usermod -aG equipo luis
      mkdir -p /opt/app /srv/web /srv/equipo /srv/compartido
      printf '#!/bin/sh\necho "App arrancada"\n' > /opt/app/arranca.sh; chmod 644 /opt/app/arranca.sh
      printf 'nombre,salario\nana,3100\nluis,2900\n' > /root/nominas.csv; chmod 644 /root/nominas.csv
      echo '<h1>Hola</h1>' > /srv/web/index.html
      chmod 755 /srv/equipo /srv/compartido
      # El backup de la noche: lo ejecuta el usuario "copias".
      mkdir -p /opt/backup /var/backups/app
      printf '#!/bin/sh\nset -e\ntar czf /var/backups/app/web-$(date +%%s%%N).tar.gz -C /srv web\necho "backup ok"\n' > /opt/backup/backup.sh
      chown root:copias /opt/backup/backup.sh; chmod 750 /opt/backup/backup.sh; chmod 755 /opt/backup
      chown copias:copias /var/backups/app; chmod 750 /var/backups/app
mision:
  - id: ejecutable
    titulo: El script que no se ejecuta
    texto: "`/opt/app/arranca.sh` da *Permission denied*. Hazlo ejecutable (sin abrirlo a todo el mundo)."
    pista: chmod +x /opt/app/arranca.sh   o   chmod 755
    xp: 10
    check: { nodo: lab, script: '/opt/app/arranca.sh >/dev/null && [ "$(stat -c %a /opt/app/arranca.sh)" != 777 ]' }
  - id: nominas
    titulo: Las nóminas son secretas
    texto: "`/root/nominas.csv` lo puede leer cualquiera. Déjalo en lectura y escritura **solo para su dueño** (en octal)."
    pista: chmod 600 /root/nominas.csv
    xp: 10
    check: { nodo: lab, script: '[ "$(stat -c %a /root/nominas.csv)" = 600 ]' }
  - id: duenio
    titulo: La web es de ana
    texto: "Cambia el dueño de `/srv/web/index.html` a `ana` y el grupo a `equipo`, en un solo comando."
    pista: chown ana:equipo /srv/web/index.html
    xp: 10
    check: { nodo: lab, script: '[ "$(stat -c %U:%G /srv/web/index.html)" = ana:equipo ]' }
  - id: setgid
    titulo: Carpeta de equipo (setgid)
    texto: "`/srv/equipo` debe ser del grupo `equipo`, con todo para dueño y grupo, nada para el resto, y que lo que se cree dentro **herede el grupo**."
    pista: chgrp equipo /srv/equipo && chmod 2770 /srv/equipo
    xp: 15
    check: { nodo: lab, script: '[ "$(stat -c %a:%G /srv/equipo)" = 2770:equipo ] && su -s /bin/sh ana -c "touch /srv/equipo/.prueba" && [ "$(stat -c %G /srv/equipo/.prueba)" = equipo ] && rm -f /srv/equipo/.prueba' }
  - id: sticky
    titulo: Carpeta compartida (sticky)
    texto: "`/srv/compartido` es para todos. Cualquiera escribe, pero **cada uno solo borra lo suyo**. Como `/tmp`."
    pista: chmod 1777 /srv/compartido
    xp: 15
    check: { nodo: lab, script: '[ "$(stat -c %a /srv/compartido)" = 1777 ] && su -s /bin/sh eva -c "echo x > /srv/compartido/.eva" && ! su -s /bin/sh luis -c "rm -f /srv/compartido/.eva" 2>/dev/null && rm -f /srv/compartido/.eva' }
  - id: shadow
    titulo: Lee permisos en octal
    texto: "Contesta con `responde shadow` y los permisos de `/etc/shadow` en número. Ahí están las contraseñas, por eso son tan cerrados."
    pista: stat -c %a /etc/shadow
    xp: 10
    check: { nodo: lab, script: 'test "$(cat /root/.respuestas/shadow 2>/dev/null)" = "$(stat -c %a /etc/shadow)"' }
boss:
  titulo: "El backup que no arranca"
  texto: "Cada noche el usuario `copias` ejecuta `/opt/backup/backup.sh`. Esta noche ha dado *Permission denied*. Arréglalo **sin** dar permisos de escritura a todo el mundo. Para probar como él, `su -s /bin/sh copias -c /opt/backup/backup.sh`."
  xp: 60
  check:
    - { nodo: lab, script: "test -x /run/boss-check.sh && /run/boss-check.sh" }
  fallos:
    - id: directorio
      romper:
        - nodo: lab
          script: |
            chmod 700 /opt/backup
            cat > /run/boss-check.sh <<'EOF'
            #!/bin/sh
            rm -f /var/backups/app/*.tar.gz
            su -s /bin/sh copias -c /opt/backup/backup.sh >/dev/null 2>&1 && ls /var/backups/app/*.tar.gz >/dev/null 2>&1 && [ -z "$(find /opt/backup /var/backups/app /srv/web -perm -0002 ! -type l)" ]
            EOF
            chmod +x /run/boss-check.sh
      pistas:
        - { coste: 5, texto: "El script tiene buenos permisos. Mira cada tramo de la ruta con `namei -l /opt/backup/backup.sh`." }
        - { coste: 10, texto: "Para llegar a un fichero necesitas `x` en cada directorio. `/opt/backup` es 700 de root." }
      solucion: "/opt/backup estaba en 700 y `copias` no podía entrar. `chmod 755 /opt/backup` lo arregla."
    - id: script
      romper:
        - nodo: lab
          script: |
            chown root:root /opt/backup/backup.sh; chmod 700 /opt/backup/backup.sh
            cat > /run/boss-check.sh <<'EOF'
            #!/bin/sh
            rm -f /var/backups/app/*.tar.gz
            su -s /bin/sh copias -c /opt/backup/backup.sh >/dev/null 2>&1 && ls /var/backups/app/*.tar.gz >/dev/null 2>&1 && [ -z "$(find /opt/backup /var/backups/app /srv/web -perm -0002 ! -type l)" ]
            EOF
            chmod +x /run/boss-check.sh
      pistas:
        - { coste: 5, texto: "Mira `ls -l /opt/backup/backup.sh`. Fíjate en el grupo y en lo que puede hacer el resto." }
        - { coste: 10, texto: "Alguien lo dejó root:root 700. Devuélvelo al grupo copias con lectura y ejecución, con `chgrp copias` y `chmod 750`." }
      solucion: "El script era root:root 700. Con `chgrp copias` y `chmod 750`, el grupo puede leerlo y ejecutarlo; el resto no."
    - id: destino
      romper:
        - nodo: lab
          script: |
            chown root:root /var/backups/app; chmod 755 /var/backups/app
            cat > /run/boss-check.sh <<'EOF'
            #!/bin/sh
            rm -f /var/backups/app/*.tar.gz
            su -s /bin/sh copias -c /opt/backup/backup.sh >/dev/null 2>&1 && ls /var/backups/app/*.tar.gz >/dev/null 2>&1 && [ -z "$(find /opt/backup /var/backups/app /srv/web -perm -0002 ! -type l)" ]
            EOF
            chmod +x /run/boss-check.sh
      pistas:
        - { coste: 5, texto: "El script arranca. Lee bien el error y mira dónde intenta escribir." }
        - { coste: 10, texto: "`/var/backups/app` es de root 755. copias no puede crear ficheros dentro porque necesita `w` en la carpeta." }
      solucion: "La carpeta de destino era de root. `chown copias /var/backups/app` le devuelve la escritura sin abrirla a nadie más."
