# 0.1 · Lab de lección 1. Una máquina con 512 MB y un cuarto de CPU, para que ocupado no se coma el servidor. La lección enseña en vivo su RAM, su CPU y sus procesos.
id: n0-1a-cuerpo
titulo: Por dentro de una máquina
motor: contenedor
pool: 1
nodos:
  - nombre: servidor
    rol: un cuarto de CPU y 512 MB de RAM
    imagen: relavops/base:1
    memoria: 512m
    cpus: 0.25
preparar:
  - nodo: servidor
    script: |
      # Guarda el código del último comando y el historial, y avisa a labd de que ha vuelto el prompt.
      cat >> /etc/bash.bashrc <<'EOF'
      PROMPT_COMMAND='echo $? > /run/.rc; history -a; printf "\033]6973;\007"'
      EOF
      : > /root/.bash_history
      # free enseña la RAM de ESTA máquina (su límite), no la del ordenador grande donde vive.
      cat > /usr/local/bin/free <<'EOF'
      #!/bin/sh
      max=$(cat /sys/fs/cgroup/memory.max 2>/dev/null); cur=$(cat /sys/fs/cgroup/memory.current 2>/dev/null)
      case "$max" in ''|max) exec /usr/bin/free "$@" ;; esac
      t=$((max / 1048576)); u=$((cur / 1048576)); l=$((t - u))
      printf '%14s %10s %10s %12s\n' total usada libre disponible
      printf 'Mem: %9s %10s %10s %12s\n' "$t" "$u" "$l" "$l"
      EOF
      chmod +x /usr/local/bin/free
      # Dos programas que el alumno lanza él mismo con & y luego para con kill.
      cat > /usr/local/bin/ocupado <<'EOF'
      #!/bin/sh
      # Hace cuentas sin parar y nunca acaba.
      touch /run/.ocupado
      while :; do :; done
      EOF
      cat > /usr/local/bin/tragon <<'EOF'
      #!/usr/bin/python3
      # Se come 300 MB de RAM y espera.
      import pathlib, time
      pathlib.Path('/run/.tragon').touch()
      b = bytearray(300 * 1024 * 1024)
      for i in range(0, len(b), 4096): b[i] = 1
      time.sleep(3600)
      EOF
      chmod +x /usr/local/bin/ocupado /usr/local/bin/tragon
      mkdir -p /srv/web && head -c 20M /dev/urandom > /srv/web/video.mp4
sondas:
  - { id: ultimo@servidor, nodo: servidor, script: "tail -n 1 /root/.bash_history 2>/dev/null" }
  - { id: ram@servidor, nodo: servidor, script: "echo $(( $(cat /sys/fs/cgroup/memory.current) / 1048576 )) $(( $(cat /sys/fs/cgroup/memory.max) / 1048576 ))" }
  - id: cpu@servidor
    nodo: servidor
    script: |
      # Porcentaje de CPU usado desde la última vez, sobre lo que le dejamos usar (cgroup v2).
      u=$(awk '/^usage_usec/ {print $2}' /sys/fs/cgroup/cpu.stat); t=$(date +%s%N)
      read q p < /sys/fs/cgroup/cpu.max; [ "$q" = max ] && q=$p
      read pu pt < /run/.cpu 2>/dev/null; echo "$u $t" > /run/.cpu
      [ -n "$pu" ] && echo $(( (u - pu) * 100000 * p / ((t - pt) * q) )) || echo 0
  - id: procesos@servidor
    nodo: servidor
    script: |
      # Solo procesos con 1 segundo o más de vida: así no parpadean los de las sondas ni los comandos rápidos.
      ps -eo pid=,etimes=,stat=,args= | awk '$2 >= 1 && $1 != 1 && $3 !~ /^Z/ && !($4 == "sleep" && $5 == "infinity") && $4 !~ /docker-init/ && $4 != "bash" && $4 != "-bash" && $5 !~ /relavops[/]vigia$/ { $2 = ""; print }'
  - { id: nproc@servidor, nodo: servidor, script: "nproc" }
  - { id: disco@servidor, nodo: servidor, script: "df -m / | awk 'NR==2 {print $3, $2}'" }
mision:
  - { id: nproc, titulo: Cuántas CPUs, texto: "`nproc`", xp: 10, check: { nodo: servidor, script: "grep -qE '^nproc' /root/.bash_history" } }
  - { id: ocupado-dentro, titulo: Lanzar ocupado, texto: "`ocupado &`", xp: 10, check: { nodo: servidor, script: "ps -eo stat=,comm= | grep -v '^Z' | grep -qw ocupado" } }
  - id: ocupado-fuera
    titulo: Parar el proceso que gasta CPU
    texto: "`kill` y su PID"
    xp: 15
    check: { nodo: servidor, script: "test -f /run/.ocupado && ! ps -eo stat=,comm= | grep -v '^Z' | grep -qw ocupado" }
  - { id: free, titulo: Ver la memoria, texto: "`free -m`", xp: 10, check: { nodo: servidor, script: "grep -qE '^free' /root/.bash_history" } }
  - { id: tragon-dentro, titulo: Lanzar tragon, texto: "`tragon &`", xp: 10, check: { nodo: servidor, script: "ps -eo stat=,comm= | grep -v '^Z' | grep -qw tragon" } }
  - id: tragon-fuera
    titulo: Parar el tragón
    texto: "`kill` y su PID"
    xp: 15
    check: { nodo: servidor, script: "test -f /run/.tragon && ! ps -eo stat=,comm= | grep -v '^Z' | grep -qw tragon" }
  - { id: ps, titulo: Ver los procesos, texto: "`ps aux`", xp: 10, check: { nodo: servidor, script: "grep -qE '^ps' /root/.bash_history" } }
  - { id: pid1, titulo: El primer proceso, texto: "`ps -p 1`", xp: 10, check: { nodo: servidor, script: "grep -qE '^ps +(-p +1|-p1)' /root/.bash_history" } }
  - { id: df, titulo: Ver el disco, texto: "`df -h`", xp: 10, check: { nodo: servidor, script: "grep -qE '^df' /root/.bash_history" } }
  - { id: uname, titulo: El kernel, texto: "`uname -r`", xp: 10, check: { nodo: servidor, script: "grep -qE '^uname' /root/.bash_history" } }
  - { id: osrelease, titulo: El sistema, texto: "`cat /etc/os-release`", xp: 10, check: { nodo: servidor, script: "grep -qE '^cat +/etc/os-release' /root/.bash_history" } }
  - id: hostname
    titulo: Su nombre
    texto: ""
    xp: 5
    check:
      nodo: servidor
      script: |
        grep -qE '^hostname' /root/.bash_history
  - id: uname0
    titulo: El kernel
    texto: ""
    xp: 5
    check:
      nodo: servidor
      script: |
        grep -qE '^uname *$' /root/.bash_history
  - id: cathost
    titulo: Leer como en el dibujo
    texto: ""
    xp: 5
    check:
      nodo: servidor
      script: |
        grep -qE '^cat +/etc/hostname' /root/.bash_history
  - id: lsweb
    titulo: Un vídeo en el disco
    texto: ""
    xp: 5
    check:
      nodo: servidor
      script: |
        grep -qE '^ls .*/srv/web' /root/.bash_history
