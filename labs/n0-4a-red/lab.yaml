# 0.4 · Lab de lección. Tres máquinas en una red propia: IPs, ping y puertos, vistos en vivo.
id: n0-4a-red
titulo: Tres máquinas en red
motor: contenedor
pool: 1
red: { subred: 10.0.0.0/24 }
nodos:
  - { nombre: tu-pc, rol: tu ordenador, ip: 10.0.0.10, imagen: "relavops/base:1", memoria: 192m, cpus: 0.5 }
  - { nombre: web, rol: servidor web, ip: 10.0.0.20, imagen: "relavops/base:1", memoria: 192m, cpus: 0.5 }
  - { nombre: db, rol: base de datos, ip: 10.0.0.30, imagen: "relavops/base:1", memoria: 192m, cpus: 0.5 }
preparar:
  - nodo: tu-pc
    script: &base |
      # Guarda el código del último comando y el historial, y avisa a labd de que ha vuelto el prompt.
      cat >> /etc/bash.bashrc <<'EOF'
      PROMPT_COMMAND='echo $? > /run/.rc; history -a; printf "\033]6973;\007"'
      EOF
      : > /root/.bash_history
  - { nodo: web, script: *base }
  - { nodo: db, script: *base }
sondas:
  # icmp@: pings recibidos, pings enviados y conexiones TCP aceptadas (de /proc/net/snmp).
  - &icmp
    id: icmp@tu-pc
    nodo: tu-pc
    script: &snmp |
      awk '/^Icmp:/ { if (!i) { split($0, k); i = 1 } else { split($0, v); for (n in k) m[k[n]] = v[n] } }
           /^Tcp:/ { if (!t) { split($0, a); t = 1 } else { split($0, b); for (n in a) c[a[n]] = b[n] } }
           END { print m["InEchos"], m["OutEchos"], c["PassiveOpens"] }' /proc/net/snmp
  - { id: icmp@web, nodo: web, script: *snmp }
  - { id: icmp@db, nodo: db, script: *snmp }
  - &puertos
    id: puertos@tu-pc
    nodo: tu-pc
    # Se esconde 127.0.0.11 por si vuelve el DNS interno de Docker, que abría un puerto al azar en cada máquina.
    script: &ss "ss -tlnH 2>/dev/null | awk '$4 !~ /^127[.]0[.]0[.]11:/ {n = split($4, a, \":\"); print a[n]}' | sort -un | tr '\\n' ' '"
  - { id: puertos@web, nodo: web, script: *ss }
  - { id: puertos@db, nodo: db, script: *ss }
  - { id: ultimo@tu-pc, nodo: tu-pc, script: "tail -n 1 /root/.bash_history 2>/dev/null" }
  - { id: ultimo@web, nodo: web, script: "tail -n 1 /root/.bash_history 2>/dev/null" }
mision:
  - { id: ipaddr, titulo: Tu IP, texto: "`ip addr`", xp: 10, check: { nodo: tu-pc, script: "grep -qE '^ip +a' /root/.bash_history" } }
  - id: pingweb
    titulo: Ping a web
    texto: "`ping -c 3 10.0.0.20`"
    xp: 10
    check: { nodo: web, script: "[ \"$(awk '/^Icmp:/ { if (!i) { split($0, k); i = 1 } else { split($0, v); for (n in k) m[k[n]] = v[n] } } END { print m[\"InEchos\"] + 0 }' /proc/net/snmp)\" -ge 1 ]" }
  - id: pingdb
    titulo: Ping a db
    texto: "`ping -c 3 10.0.0.30`"
    xp: 10
    check: { nodo: db, script: "[ \"$(awk '/^Icmp:/ { if (!i) { split($0, k); i = 1 } else { split($0, v); for (n in k) m[k[n]] = v[n] } } END { print m[\"InEchos\"] + 0 }' /proc/net/snmp)\" -ge 1 ]" }
  - { id: pingnadie, titulo: Ping a nadie, texto: "`ping -c 2 10.0.0.99`", xp: 10, check: { nodo: tu-pc, script: "grep -qE '^ping .*10\\.0\\.0\\.99' /root/.bash_history" } }
  - { id: puerto, titulo: Abrir el 8080 en web, texto: "`nc -lk 8080`", xp: 15, check: { nodo: web, script: "ss -tlnH | grep -q ':8080 '" } }
  - id: conectar
    titulo: Llamar a esa puerta
    texto: "`nc -zv 10.0.0.20 8080`"
    xp: 15
    check: { nodo: web, script: "[ \"$(awk '/^Tcp:/ { if (!t) { split($0, a); t = 1 } else { split($0, b); for (n in a) c[a[n]] = b[n] } } END { print c[\"PassiveOpens\"] + 0 }' /proc/net/snmp)\" -ge 1 ]" }
  - id: hostpc
    titulo: Nombre de tu-pc
    texto: ""
    xp: 5
    check:
      nodo: tu-pc
      script: |
        grep -qE '^hostname *$' /root/.bash_history
  - id: hostI
    titulo: IPs en una línea
    texto: ""
    xp: 5
    check:
      nodo: tu-pc
      script: |
        grep -qE '^hostname +-I' /root/.bash_history
  - id: ss
    titulo: Puertas abiertas
    texto: ""
    xp: 5
    check:
      nodo: tu-pc
      script: |
        grep -qE '^ss' /root/.bash_history
