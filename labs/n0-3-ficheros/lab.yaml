# 0.3 · Sistema de ficheros: ordenar un servidor caótico, enlaces e inodos, y el disco que se llena.
id: n0-3-ficheros
titulo: El servidor caótico
motor: contenedor
pool: 1
nodos:
  - nombre: lab
    imagen: relavops/base:1
    memoria: 320m
    cpus: 1
    tmpfs: { /datos: 64m }
preparar:
  - nodo: lab
    script: |
      cat > /usr/local/bin/responde <<'EOF'
      #!/bin/sh
      [ $# -ge 2 ] || { echo "uso: responde <pregunta> <respuesta>"; exit 1; }
      mkdir -p /root/.respuestas; k=$1; shift
      printf '%s\n' "$*" > "/root/.respuestas/$k"; echo "Apuntado: $k = $*"
      EOF
      chmod +x /usr/local/bin/responde
      mkdir -p /root/descargas && cd /root/descargas
      for i in 1 2 3 4 5 6 7 8; do head -c 2000 /dev/urandom > "foto-vacaciones-$i.jpg"; done
      for i in 1 2 3; do echo "factura $i" > "factura-$i.pdf"; done
      echo "no me muevas" > notas.txt
      mkdir -p /srv/config && printf 'puerto=8080\nmodo=produccion\n' > /srv/config/app.conf
      # 400 ficheros pequeños y uno solo de más de 5 MB, con nombre aburrido.
      mkdir -p /srv/archivo && cd /srv/archivo
      for i in $(seq 1 400); do head -c $((RANDOM % 3000 + 200)) /dev/urandom > "registro-$i.dat"; done
      g=$(shuf -n1 -i 1-400); head -c 6M /dev/urandom > "registro-$g.dat"; echo "registro-$g.dat" > /run/.grande
      # El disco /datos: datos de clientes que NO se pueden perder.
      head -c 8M /dev/urandom > /datos/clientes.db; md5sum /datos/clientes.db > /run/.md5
      mkdir -p /datos/informes; echo "informe Q3" > /datos/informes/q3.txt
mision:
  - id: estructura
    titulo: Monta la estructura
    texto: "Crea `~/web` con tres carpetas dentro, `css`, `js` e `img`. Si te atreves, de un solo comando."
    pista: mkdir -p ~/web/{css,js,img}
    xp: 10
    check: { nodo: lab, script: "test -d /root/web/css -a -d /root/web/js -a -d /root/web/img" }
  - id: fotos
    titulo: Recoge las fotos
    texto: "Mueve todas las `.jpg` de `~/descargas` a `~/web/img`. Las facturas y las notas se quedan donde están."
    pista: mv ~/descargas/*.jpg ~/web/img/
    xp: 10
    check: { nodo: lab, script: '[ "$(ls /root/web/img/*.jpg 2>/dev/null | wc -l)" -eq 8 ] && ! ls /root/descargas/*.jpg >/dev/null 2>&1 && [ -f /root/descargas/notas.txt ] && [ "$(ls /root/descargas/*.pdf | wc -l)" -eq 3 ]' }
  - id: simbolico
    titulo: Un atajo (enlace simbólico)
    texto: "Crea `~/sitio` como enlace **simbólico** que apunte a `~/web`."
    pista: ln -s /root/web /root/sitio
    xp: 10
    check: { nodo: lab, script: 'test -L /root/sitio && [ "$(readlink -f /root/sitio)" = /root/web ]' }
  - id: duro
    titulo: Otro nombre, mismo fichero (enlace duro)
    texto: "Crea `/root/app.conf` como enlace **duro** de `/srv/config/app.conf`. Comprueba con `ls -li` que comparten inodo."
    pista: ln /srv/config/app.conf /root/app.conf
    xp: 15
    check: { nodo: lab, script: '[ ! -L /root/app.conf ] && [ "$(stat -c %i /root/app.conf 2>/dev/null)" = "$(stat -c %i /srv/config/app.conf)" ]' }
  - id: inodo
    titulo: ¿Qué número de inodo tiene?
    texto: "Contesta con `responde inodo` y el número de inodo de `/srv/config/app.conf`."
    pista: ls -i /srv/config/app.conf   o   stat /srv/config/app.conf
    xp: 10
    check: { nodo: lab, script: 'test "$(cat /root/.respuestas/inodo 2>/dev/null)" = "$(stat -c %i /srv/config/app.conf)"' }
  - id: grande
    titulo: La aguja en el pajar
    texto: "En `/srv/archivo` hay 401 ficheros. Solo uno pesa más de 5 MB. Contesta con `responde grande` y su nombre."
    pista: find /srv/archivo -size +5M
    xp: 15
    check: { nodo: lab, script: 'test "$(basename "$(cat /root/.respuestas/grande 2>/dev/null)")" = "$(cat /run/.grande)"' }
boss:
  titulo: "Quién llena el disco"
  texto: "Alerta. `/datos` está por encima del 90 %. Déjalo por debajo del 40 % **sin tocar** `clientes.db` ni los informes. Empieza por `df -h /datos`."
  xp: 60
  check:
    - { nodo: lab, script: "test -x /run/boss-check.sh && /run/boss-check.sh" }
  fallos:
    - id: oculto
      romper:
        - nodo: lab
          script: |
            d=/datos/informes/.cache/tmp/.sesion-7f3/.x; mkdir -p "$d"; head -c 50M /dev/zero > "$d/core.1337"
            cat > /run/boss-check.sh <<'EOF'
            #!/bin/sh
            [ "$(df --output=pcent /datos | tail -1 | tr -dc 0-9)" -lt 40 ] && md5sum -c --quiet /run/.md5 && [ -f /datos/informes/q3.txt ]
            EOF
            chmod +x /run/boss-check.sh
      pistas:
        - { coste: 5, texto: "`du -sh /datos/*` no enseña lo que empieza por punto. Prueba `du -ah /datos | sort -h | tail`." }
        - { coste: 10, texto: "Hay un core dump escondido en una cadena de carpetas ocultas dentro de informes." }
      solucion: Un volcado de memoria de 50 MB en `/datos/informes/.cache/…/.x/`. `du -a | sort -h` ve también lo oculto.
    - id: muchos
      romper:
        - nodo: lab
          script: |
            mkdir -p /datos/sesiones; i=0; while [ $i -lt 2000 ]; do head -c 26K /dev/zero > /datos/sesiones/sess_$i; i=$((i+1)); done
            cat > /run/boss-check.sh <<'EOF'
            #!/bin/sh
            [ "$(df --output=pcent /datos | tail -1 | tr -dc 0-9)" -lt 40 ] && md5sum -c --quiet /run/.md5 && [ -f /datos/informes/q3.txt ]
            EOF
            chmod +x /run/boss-check.sh
      pistas:
        - { coste: 5, texto: "No hay ningún fichero grande. Mira qué carpeta pesa con `du -sh /datos/*`." }
        - { coste: 10, texto: "2000 ficheros de sesión de 26 KB. `ls /datos/sesiones | wc -l`." }
      solucion: 2000 ficheros de sesión de 26 KB. Ninguno es grande; la carpeta sí. `du -sh` por carpetas antes que buscar ficheros.
    - id: borrado
      romper:
        - nodo: lab
          script: |
            cp "$(readlink -f /usr/bin/python3)" /usr/local/sbin/exportador
            setsid nohup /usr/local/sbin/exportador -c "import time,os; f=open('/datos/export.tmp','wb'); f.write(b'0'*50*1024*1024); f.flush(); os.remove('/datos/export.tmp'); time.sleep(99999)" >/dev/null 2>&1 &
            sleep 1
            cat > /run/boss-check.sh <<'EOF'
            #!/bin/sh
            [ "$(df --output=pcent /datos | tail -1 | tr -dc 0-9)" -lt 40 ] && md5sum -c --quiet /run/.md5 && [ -f /datos/informes/q3.txt ]
            EOF
            chmod +x /run/boss-check.sh
      pistas:
        - { coste: 5, texto: "`df` dice que está lleno pero `du` no encuentra nada. ¿Recuerdas la lección? rm quita el nombre, no los datos, si alguien lo tiene abierto." }
        - { coste: 10, texto: "Busca ficheros abiertos que ya están borrados con `ls -l /proc/*/fd 2>/dev/null | grep deleted`." }
        - { coste: 10, texto: "Ese número de la ruta /proc/<PID>/fd es el proceso. Párale (kill) y el kernel libera el espacio." }
      solucion: Un proceso tenía abierto un fichero ya borrado. El inodo vive mientras alguien lo tenga abierto; matar al proceso lo libera.
