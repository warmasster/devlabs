<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <script id="dl-modo">try{for(const k of Object.keys(localStorage))if(k.startsWith("devlabs.")){const n="relavops"+k.slice(7);if(localStorage.getItem(n)===null)localStorage.setItem(n,localStorage.getItem(k));localStorage.removeItem(k)}}catch{}document.documentElement.dataset.modo = localStorage.getItem('relavops.modo') === 'clasico' ? 'clasico' : 'isla';</script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mi cuenta · relavops</title>
  <link rel="icon" href="/favicon.svg" />
</head>
<body>
  <header class="cabecera">
    <a class="volver" href="/curso"><i data-ic="chevron-left"></i> El curso</a>
    <h1><i data-ic="user"></i> Mi cuenta</h1>
    <span class="espacio"></span>
    <span id="ajustes"></span>
  </header>
  <main class="cp-main" id="main">
    <p class="cp-cargando">Cargando tu cuenta…</p>
  </main>
  <script type="module" src="/src/cuenta/cuenta.ts"></script>
</body>
</html>
