<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <script id="dl-modo">try{for(const k of Object.keys(localStorage))if(k.startsWith("devlabs.")){const n="relavops"+k.slice(7);if(localStorage.getItem(n)===null)localStorage.setItem(n,localStorage.getItem(k));localStorage.removeItem(k)}}catch{}document.documentElement.dataset.modo = localStorage.getItem('relavops.modo') === 'clasico' ? 'clasico' : 'isla';</script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>M3 · Lab con boss</title>
  <link rel="icon" href="/favicon.svg" />
  <style>
    body { height: 100vh; display: flex; flex-direction: column; }
    main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 14px; padding: 14px; min-height: 0; }
    .izq { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
    #topo { width: 100%; height: 120px; background: #12151d; border: 1px solid var(--borde); border-radius: var(--radio); }
    #topo .nodo { cursor: pointer; }
    .terminales { flex: 1; position: relative; min-height: 300px; }
    .terminales .terminal-caja { position: absolute; inset: 0; display: none; }
    .terminales .terminal-caja.activa { display: block; }
    .der { overflow: auto; display: flex; flex-direction: column; gap: 12px; }
    .paso { padding: 10px; border-radius: var(--radio); border: 1px solid transparent; }
    .paso.actual { border-color: var(--acento); background: #142033; }
    .paso.hecho { opacity: 0.75; }
    .paso .t { font-weight: 600; display: flex; gap: 8px; align-items: center; }
    .paso .x { color: var(--suave); font-size: 14px; margin-top: 3px; }
    .paso .pista { font: 13px var(--mono); color: var(--aviso); margin-top: 6px; display: none; }
    .paso.ver-pista .pista { display: block; }
    .boss { border: 1px solid #6b2c2c; background: linear-gradient(180deg, #2a1418, var(--panel)); }
    .boss.vencido { border-color: var(--ok); background: linear-gradient(180deg, #12301f, var(--panel)); }
    .reloj { font: 700 28px var(--mono); }
    .pista-boss { font-size: 14px; padding: 8px 10px; background: var(--panel-2); border-radius: var(--radio); margin-top: 8px; }
    .cifras { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .cifras div { background: var(--panel-2); border-radius: var(--radio); padding: 8px; text-align: center; }
    .cifras b { display: block; font: 700 18px var(--mono); }
    .cifras span { font-size: 12px; color: var(--suave); }
    @media (max-width: 1000px) { main { grid-template-columns: 1fr; } .terminales { min-height: 420px; } }
  </style>
</head>
<body>
  <header class="cabecera">
    <a class="volver" href="/">← Muestrario</a>
    <h1>M3 · Conecta dos redes con OSPF</h1>
    <span class="criterio">Criterio: cada paso se valida solo en menos de 1 s con feedback inmediato, y el lab arranca en menos de 3 s.</span>
    <span class="espacio"></span>
    <span id="ajustes"></span>
  </header>
  <main>
    <section class="izq">
      <svg id="topo" viewBox="0 0 900 120" aria-label="Topología: h1, r1, r2, h2"></svg>
      <div class="pestanas" id="pestanas"></div>
      <div class="terminales" id="terminales"></div>
    </section>
    <aside class="der">
      <div class="panel">
        <div class="cifras">
          <div><b id="c-arranque">–</b><span>lab asignado</span></div>
          <div><b id="c-check">–</b><span>comprobación</span></div>
          <div><b id="c-feedback">–</b><span>fin del comando → <i data-ic="check"></i></span></div>
        </div>
      </div>
      <div class="panel">
        <h2 style="display:flex;justify-content:space-between">Misión <span class="pildora" id="xp" style="color:var(--xp)">0 XP</span></h2>
        <div class="barra"><div id="barra" style="width:0%"></div></div>
        <p id="faltan" style="margin:6px 0 10px;color:var(--suave);font-size:14px"></p>
        <div id="pasos"></div>
      </div>
      <div class="panel boss" id="boss" hidden>
        <h2 id="boss-titulo"></h2>
        <p id="boss-texto" style="margin:0 0 10px;color:var(--suave)"></p>
        <div id="boss-inicio"><button class="btn primario" id="boss-empezar"><i data-ic="swords"></i> Que venga el boss</button></div>
        <div id="boss-curso" hidden>
          <div class="reloj" id="reloj">00:00</div>
          <button class="btn" id="boss-pista"><i data-ic="lightbulb"></i> Pista</button>
          <div id="boss-pistas"></div>
        </div>
        <div id="boss-fin" hidden></div>
      </div>
    </aside>
  </main>
  <script type="module" src="/src/m3.ts"></script>
</body>
</html>
